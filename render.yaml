# Render Blueprint — GRAAS API (free web service).
# Requires env groups / dashboard secrets for Mongo + Redis (see DEPLOY.md).
services:
  - type: web
    name: graas-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: api
    dockerfilePath: ./Dockerfile.bundle
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    branch: main
    buildFilter:
      paths:
        - api/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8000"
      - key: SSRF_PROTECTION
        value: "true"
      - key: REQUIRE_REDIS
        value: "true"
      - key: MONGODB_URI
        value: mongodb://127.0.0.1:27017/graas
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://graas-alpha.vercel.app
      - key: PUBLIC_BASE_URL
        value: https://graas-api.onrender.com
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: nvidia/nemotron-3.5-lightning:free
      - key: LLM_TOOLS_ENABLED
        value: "true"
