# Local LLM overlay — merged by `npm run docker:up` and `npm run dev:llm`.
# Compose reads LOCAL_LLM_MODEL_PATH via: --env-file api/.env (do not use env_file on llama).
name: graas

services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: grass-llama
    ports:
      - "8080:8080"
    volumes:
      - ${LOCAL_LLM_MODEL_PATH}:/models/model.gguf:ro
    command:
      - -m
      - /models/model.gguf
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --ctx-size
      - "4096"
    restart: unless-stopped
    healthcheck:
      # /health returns 503 until the GGUF finishes loading (several minutes on CPU).
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health >/dev/null"]
      interval: 20s
      timeout: 15s
      retries: 15
      start_period: 600s

  api:
    depends_on:
      llama:
        # Start API once llama container is running; model may still be loading (API retries LLM).
        condition: service_started
