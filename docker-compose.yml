# GRASS — single Docker Compose file (repo root)
#
# Infra only (API/Web on host via hot-reload):
#   npm run dev:services
#   npm run dev
#
# Full stack in Docker (infra + API + web):
#   npm run docker:up
#
# Optional Playwright worker:
#   npm run docker:full
name: graas

services:
  mongo:
    image: mongo:7
    container_name: grass-mongo
    ports:
      # Override with MONGO_HOST_PORT if 27017 is already in use on the host.
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - grass_mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: grass-redis
    ports:
      - "6379:6379"
    volumes:
      - grass_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # Upstream minio/minio was removed from Docker Hub/Quay. Bitnami's legacy
    # mirror ships the same MinIO server; MINIO_BROWSER=on enables the console.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: grass-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-grassadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-grasssecret123}
      MINIO_BROWSER: "on"
      MINIO_DATA_DIR: /bitnami/minio/data
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    volumes:
      - grass_minio_data:/bitnami/minio/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    container_name: grass-neo4j
    ports:
      # Host ports match api/.env defaults (bolt://localhost:7687, browser :7474)
      # If Windows reserves 7474/7687, change to "17474:7474" and "17687:7687" and update .env
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-grasspass123}
    volumes:
      - grass_neo4j_data:/data
      - grass_neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-grasspass123}", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  api:
    profiles: ["app"]
    build:
      context: ./api
      dockerfile: Dockerfile.chrome
    container_name: grass-api
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - ./api/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/graas
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio
      NEO4J_URI: bolt://neo4j:7687
      PLAYWRIGHT_WORKER_URL: http://playwright:8001
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - grass_uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  web:
    profiles: ["app"]
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: grass-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  playwright:
    profiles: ["full"]
    build:
      context: ./api/docker/playwright-worker
      dockerfile: Dockerfile
    container_name: grass-playwright
    ports:
      - "8001:8001"
    restart: unless-stopped

volumes:
  grass_mongo_data:
  grass_redis_data:
  grass_minio_data:
  grass_neo4j_data:
  grass_neo4j_logs:
  grass_uploads:
